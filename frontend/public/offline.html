<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline — FleetPay Jabodetabek</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 1.5rem;
      }
      .card {
        max-width: 440px;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 16px;
        padding: 1.75rem;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.25rem; }
      p { margin: 0 0 1rem; color: #94a3b8; line-height: 1.5; font-size: 0.95rem; }
      button {
        background: #0ea5e9;
        color: #020617;
        border: 0;
        border-radius: 10px;
        padding: 0.75rem 1.25rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Network Offline</h1>
      <p>
        FleetPay cannot reach the dealership server right now. Open the cached app shell
        to continue logging deliveries into your local IndexedDB queue.
      </p>
      <button type="button" onclick="window.location.href='/'">Open Cached Workspace</button>
    </main>
  </body>
</html>
